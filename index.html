<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Group Wrapped</title>
<style>
  :root { color-scheme: dark; --ink: #f4ecda; --muted: rgba(244,236,218,.72); --accent: #e0a526; --card: rgba(244,236,218,.1); }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; }
  body { margin: 0; font: 18px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; background: #2b3438; color: var(--ink); }
  /* Norwich colours, in the chunky Spotify Wrapped style: one bold colour block per slide.
     Flint grey, Caen stone cream, red brick, and river green, with mustard (Colman's) and brick as the accents. */
  .t0 { --bg1: #2b3438; --bg2: #14191c; --ink: #f4ecda; --muted: rgba(244,236,218,.72); --accent: #e0a526; --card: rgba(244,236,218,.09); }
  .t1 { --bg1: #efe5cd; --bg2: #ddcfae; --ink: #2b2420; --muted: rgba(43,36,32,.72); --accent: #a43a2a; --card: rgba(43,36,32,.08); }
  .t2 { --bg1: #98392a; --bg2: #6b2217; --ink: #f7efdd; --muted: rgba(247,239,221,.8); --accent: #f0bc4a; --card: rgba(0,0,0,.16); }
  .t3 { --bg1: #3b4d44; --bg2: #1f2b25; --ink: #f4ecda; --muted: rgba(244,236,218,.72); --accent: #d9b45f; --card: rgba(244,236,218,.09); }
  .slide { position: relative; min-height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center;
    padding: 8vh max(6vw, 20px) 14vh; background: linear-gradient(140deg, var(--bg1), var(--bg2)); color: var(--ink); overflow: hidden; }
  .slide::before { content: ''; position: absolute; width: 70vmin; height: 70vmin; right: -22vmin; top: -22vmin; border-radius: 50%; background: var(--accent); opacity: .16; }
  .slide > * { position: relative; z-index: 1; max-width: 980px; width: 100%; margin-inline: auto; }
  .slide > .sky { position: absolute; z-index: 0; left: 0; bottom: 0; margin: 0; max-width: none; height: 26vh; color: var(--ink); opacity: .14; pointer-events: none; }
  .sky .win { fill: var(--bg1); }
  .sky .wire { fill: none; stroke: var(--bg1); stroke-width: 1.6; }
  .kicker { text-transform: uppercase; letter-spacing: .16em; font-size: .75rem; font-weight: 700; color: var(--muted); margin: 0 0 .6rem; }
  .slide > .kicker:first-child { margin-bottom: 1rem; }
  .slide > .kicker:first-child span { background: var(--ink); color: var(--bg1); padding: 6px 14px; border-radius: 999px; }
  h1, h2 { margin: 0 0 1rem; line-height: .98; letter-spacing: -.035em; font-weight: 900; }
  h1 { font-size: clamp(3rem, 11vw, 7.5rem); }
  h2 { font-size: clamp(2.1rem, 6.5vw, 4.4rem); }
  .big { font-size: clamp(5rem, 24vw, 13rem); font-weight: 900; line-height: .9; letter-spacing: -.06em; color: var(--accent); }
  .sub { color: var(--muted); font-size: 1.15rem; margin: .5rem 0 0; font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 1.5rem; }
  .stat { background: var(--card); border-radius: 20px; padding: 18px 20px; }
  .stat b { display: block; font-size: 2.4rem; font-weight: 900; letter-spacing: -.03em; }
  .stat span { color: var(--muted); font-size: .9rem; }
  .bars .row { display: grid; grid-template-columns: minmax(70px, 150px) 1fr auto; gap: 12px; align-items: center; margin: 10px 0; font-weight: 600; }
  .bars .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .bar { height: 24px; background: var(--card); border-radius: 12px; overflow: hidden; }
  .bars .bar i { display: block; height: 100%; width: 0; border-radius: 12px; background: var(--accent);
    transition: width 1s cubic-bezier(.2,.8,.2,1) var(--d); }
  .in .bars .bar i { width: var(--w); }
  .bars .val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3ch; text-align: right; }
  .cols { height: 280px; display: flex; gap: 4px; align-items: flex-end; margin-top: 1.5rem; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: .7rem; color: var(--muted); min-width: 0; }
  .col i { width: 100%; height: 0; border-radius: 6px 6px 0 0; background: color-mix(in srgb, var(--accent) 55%, transparent); transition: height .9s cubic-bezier(.2,.8,.2,1) var(--d); }
  .in .col i { height: calc(var(--h2) * .85); }
  .col.hi i { background: var(--accent); }
  .col b { font-weight: 400; margin-top: 4px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; }
  .chip { background: var(--card); border-radius: 999px; padding: 7px 16px; }
  .chip small { color: var(--muted); }
  .emoji { font-size: 2.4rem; }
  .awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 1rem; }
  .award { background: var(--card); border-radius: 20px; padding: 18px 20px; }
  .award em { font-style: normal; font-size: 1.8rem; }
  .award h3 { margin: .2rem 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  .award b { font-size: 1.3rem; display: block; font-weight: 800; }
  .award span { color: var(--muted); font-size: .9rem; }
  .quote { background: var(--card); border-radius: 20px; padding: 16px 20px; margin-top: 1rem; font-size: .95rem; max-height: 9em; overflow: auto; white-space: pre-wrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
  /* intro and settings */
  #intro { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(140deg, #2b3438, #14191c); }
  #intro .card { max-width: 560px; }
  #drop { border: 2px dashed rgba(255,255,255,.35); border-radius: 18px; padding: 36px 20px; text-align: center; cursor: pointer; margin: 1.2rem 0; }
  #drop.over { background: rgba(255,255,255,.1); }
  button, select, input[type=text] { font: inherit; color: inherit; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 6px 12px; }
  button { cursor: pointer; }
  #settings { position: fixed; top: 10px; right: 10px; z-index: 5; display: none; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); padding: 8px; border-radius: 14px; font-size: .8rem; max-width: 95vw; }
  #settings label { display: flex; align-items: center; gap: 6px; }
  #settings input, #settings select, #settings button { font-size: .8rem; padding: 4px 8px; }
  #settings input { width: 9em; }
  .hint { color: var(--muted); font-size: .85rem; }
  #err { color: #ff9b9b; }
  dialog { background: #171727; color: var(--ink); border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 22px; max-width: 520px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h2 { font-size: 1.5rem; margin: 0 0 .5rem; }
  dialog input[type=password], dialog input[type=text], dialog select, dialog progress { display: block; width: 100%; margin: 10px 0; }
  dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  dialog code { background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 6px; }
  .story > div { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0 14px; padding: 12px 0; border-bottom: 1px solid var(--card); }
  .story .m { color: var(--accent); font-weight: 900; font-size: 1.1rem; text-transform: uppercase; }
  .story h3 { margin: 0; font-size: 1.15rem; font-weight: 800; }
  .story p { margin: .2rem 0 0; color: var(--muted); font-size: .95rem; }
  [hidden] { display: none !important; }

#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#2b3438,#14191c)}#gate form{max-width:380px;width:100%}#gate input{display:block;width:100%;margin:.8rem 0}</style>
<div id="gate"><form id="f"><p class="kicker">Private</p><h1 style="font-size:2.4rem">Group Wrapped</h1><input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus><button>Open</button><p id="msg" class="hint"></p></form></div>
<main id="deck"></main>
<script>(function staticUnlock(P) {
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.textContent = 'Unlocking…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.iv) }, key, unb64(P.ct)));
      document.getElementById('gate').remove();
      document.getElementById('deck').innerHTML = html;
      const io = new IntersectionObserver((es) => es.forEach((x) => x.target.classList.toggle('in', x.isIntersecting)), { threshold: 0.35 });
      document.querySelectorAll('.slide').forEach((s) => io.observe(s));
    } catch { msg.textContent = 'Wrong password.'; }
  };
